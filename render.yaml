services:
  - type: web
    name: personalfinance-api
    runtime: python
    region: virginia
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MONTHLY_REQUEST_LIMIT
        value: "100"
      - key: LLM_GLOBAL_DAILY_REQUEST_LIMIT
        value: "2000"
      - key: ENABLE_LOCAL_EMBEDDINGS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PLAID_PRODUCTION_CLIENT_ID
        sync: false
      - key: PLAID_PRODUCTION_SECRET
        sync: false

  - type: web
    name: personalfinance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_APP_MODE
        value: hosted
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
